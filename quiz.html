<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz – Kokteje & Pije</title>
  <style>
    /* ── Bazë ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:      #c9a84c;
      --gold-lt:   #e8c97a;
      --burg:      #6b1a2a;
      --burg-dk:   #4a1020;
      --cream:     #fdf6ec;
      --cream-dk:  #f0e4ce;
      --text:      #2d1a0e;
      --text-lt:   #6b4c30;
      --correct:   #2e7d4f;
      --correct-bg:#e8f5ee;
      --wrong:     #b71c1c;
      --wrong-bg:  #fdecea;
      --shadow:    0 4px 24px rgba(107,26,42,.13);
      --radius:    18px;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #2d1a0e 0%, #6b1a2a 55%, #3a0a18 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      padding: 16px;
    }

    /* ── Karta kryesore ── */
    .card {
      background: var(--cream);
      border-radius: var(--radius);
      box-shadow: var(--shadow), 0 0 0 3px var(--gold);
      width: 100%;
      max-width: 680px;
      overflow: hidden;
      animation: slideUp .45s cubic-bezier(.22,1,.36,1);
    }

    @keyframes slideUp {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, var(--burg-dk), var(--burg));
      padding: 24px 28px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-title {
      color: var(--gold-lt);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: .5px;
    }
    .header-sub {
      color: rgba(255,255,255,.65);
      font-size: .82rem;
      margin-top: 2px;
    }
    .score-badge {
      background: var(--gold);
      color: var(--burg-dk);
      font-weight: 800;
      font-size: .9rem;
      border-radius: 50px;
      padding: 6px 16px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      background: var(--cream-dk);
      height: 7px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-lt));
      transition: width .5s ease;
      border-radius: 0 4px 4px 0;
    }

    /* ── Body ── */
    .body { padding: 28px; }

    /* ── Kategoria ── */
    .category-tag {
      display: inline-block;
      background: var(--cream-dk);
      color: var(--burg);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 50px;
      margin-bottom: 14px;
      border: 1px solid rgba(107,26,42,.2);
    }

    /* ── Pyetja ── */
    .question {
      font-size: 1.13rem;
      font-weight: 700;
      line-height: 1.55;
      color: var(--burg-dk);
      margin-bottom: 22px;
    }

    /* ── Opsionet ── */
    .options { display: flex; flex-direction: column; gap: 11px; }

    .option {
      background: #fff;
      border: 2px solid var(--cream-dk);
      border-radius: 12px;
      padding: 14px 18px;
      cursor: pointer;
      font-size: .95rem;
      color: var(--text);
      line-height: 1.45;
      transition: border-color .2s, background .2s, transform .15s;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .option-letter {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--cream-dk);
      color: var(--burg);
      font-weight: 800;
      font-size: .8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      transition: background .2s, color .2s;
    }

    .option:hover:not(.disabled) {
      border-color: var(--gold);
      background: #fff9f0;
      transform: translateX(3px);
    }
    .option:hover:not(.disabled) .option-letter {
      background: var(--gold);
      color: #fff;
    }

    /* Feedback pas përgjigjes */
    .option.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
    }
    .option.correct .option-letter {
      background: var(--correct);
      color: #fff;
    }
    .option.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
    }
    .option.wrong .option-letter {
      background: var(--wrong);
      color: #fff;
    }
    .option.disabled { cursor: default; }
    .option.disabled:hover { transform: none; }

    /* ── Feedback mesazhi ── */
    .feedback {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: .92rem;
      display: none;
      animation: fadeIn .3s ease;
    }
    .feedback.show { display: block; }
    .feedback.ok  { background: var(--correct-bg); color: var(--correct); border-left: 4px solid var(--correct); }
    .feedback.err { background: var(--wrong-bg);   color: var(--wrong);   border-left: 4px solid var(--wrong); }

    @keyframes fadeIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }

    /* ── Butoni Tjetër ── */
    .btn-next {
      margin-top: 22px;
      width: 100%;
      background: linear-gradient(135deg, var(--burg), var(--burg-dk));
      color: var(--gold-lt);
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .5px;
      transition: opacity .2s, transform .15s;
      display: none;
    }
    .btn-next.show { display: block; }
    .btn-next:hover { opacity: .9; transform: scale(1.01); }

    /* ── Ekrani rezultatit ── */
    .result-screen {
      padding: 36px 28px;
      text-align: center;
      display: none;
    }
    .result-screen.show { display: block; }

    .result-icon { font-size: 4rem; margin-bottom: 10px; }
    .result-score {
      font-size: 3rem;
      font-weight: 900;
      color: var(--burg);
      line-height: 1;
    }
    .result-out-of {
      color: var(--text-lt);
      font-size: 1rem;
      margin-top: 4px;
      margin-bottom: 14px;
    }
    .result-msg {
      font-size: 1.05rem;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 28px;
      background: var(--cream-dk);
      padding: 14px 18px;
      border-radius: 12px;
    }

    .result-bars { margin-bottom: 24px; }
    .result-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: .85rem;
    }
    .result-bar-label { width: 90px; text-align: right; color: var(--text-lt); }
    .result-bar-track {
      flex: 1;
      height: 12px;
      background: var(--cream-dk);
      border-radius: 6px;
      overflow: hidden;
    }
    .result-bar-fill {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--gold), var(--gold-lt));
      transition: width 1s cubic-bezier(.22,1,.36,1);
    }
    .result-bar-pct { width: 36px; color: var(--burg); font-weight: 700; }

    .btn-restart {
      background: linear-gradient(135deg, var(--gold), var(--gold-lt));
      color: var(--burg-dk);
      border: none;
      border-radius: 12px;
      padding: 15px 36px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: .5px;
      transition: opacity .2s, transform .15s;
      box-shadow: 0 4px 16px rgba(201,168,76,.4);
    }
    .btn-restart:hover { opacity: .9; transform: scale(1.02); }

    /* ── Animacion pyetje ── */
    .quiz-body { animation: fadeIn .35s ease; }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .header { padding: 18px 18px 16px; }
      .body { padding: 20px; }
      .question { font-size: 1rem; }
      .option { padding: 12px 14px; font-size: .9rem; }
      .result-screen { padding: 28px 20px; }
    }
  </style>
</head>

/* ================================================================
   SHUFFLE UTILITIES
================================================================ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Merr pyetjet, shuffle-on rendin dhe opsionet (mban track të saktit)
function buildShuffledQuestions() {
  return shuffle(ALL_QUESTIONS).map(q => {
    const indexed = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
    const shuffledOpts = shuffle(indexed);
    return {
      category: q.category,
      question: q.question,
      options: shuffledOpts.map(o => o.text),
      correct: shuffledOpts.findIndex(o => o.isCorrect)
    };
  });
}

/* ================================================================
   GJENDJA E QUIZIT
================================================================ */
let questions   = [];
let current     = 0;
let score       = 0;
let answered    = false;

// Statistikat sipas kategorisë
let catStats = {};

/* ================================================================
   INICIALIZIMI
================================================================ */
function startQuiz() {
  questions = buildShuffledQuestions();
  current   = 0;
  score     = 0;
  answered  = false;
  catStats  = {};

  document.getElementById('quizScreen').style.display  = '';
  document.getElementById('resultScreen').classList.remove('show');

  renderQuestion();
}

/* ================================================================
   RENDER PYETJES
================================================================ */
function renderQuestion() {
  const q = questions[current];

  // Header
  document.getElementById('progressLabel').textContent =
    `Pyetja ${current + 1} nga ${questions.length}`;
  document.getElementById('scoreBadge').textContent = `${score} pikë`;

  // Progress bar
  const pct = (current / questions.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';

  // Kategoria
  document.getElementById('catTag').textContent = q.category;

  // Pyetja
  document.getElementById('questionText').textContent = q.question;

  // Opsionet
  const list = document.getElementById('optionsList');
  const letters = ['A', 'B', 'C', 'D'];
  list.innerHTML = q.options.map((opt, i) => `
    <button class="option" id="opt${i}" onclick="selectOption(${i})">
      <span class="option-letter">${letters[i]}</span>
      <span>${opt}</span>
    </button>
  `).join('');

  // Feedback & buton
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = '';

  const btn = document.getElementById('btnNext');
  btn.className = 'btn-next';
  btn.textContent = current === questions.length - 1 ? 'Shiko rezultatin ✓' : 'Pyetja tjetër →';

  answered = false;

  // Animacion refresh
  const body = document.getElementById('quizBody');
  body.style.animation = 'none';
  void body.offsetWidth;
  body.style.animation = 'fadeIn .35s ease';
}

/* ================================================================
   SELEKTIMI I OPSIONIT
================================================================ */
function selectOption(idx) {
  if (answered) return;
  answered = true;

  const q = questions[current];
  const isCorrect = idx === q.correct;

  // CSS feedback
  document.querySelectorAll('.option').forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === q.correct) btn.classList.add('correct');
    else if (i === idx && !isCorrect) btn.classList.add('wrong');
  });

  // Pikë dhe statistika
  if (isCorrect) score++;
  if (!catStats[q.category]) catStats[q.category] = { correct: 0, total: 0 };
  catStats[q.category].total++;
  if (isCorrect) catStats[q.category].correct++;

  // Mesazhi feedback
  const fb = document.getElementById('feedback');
  if (isCorrect) {
    fb.className = 'feedback ok show';
    fb.textContent = '✓ Saktë! Bravo!';
  } else {
    fb.className = 'feedback err show';
    fb.textContent = `✗ Gabim! Përgjigja e saktë: "${q.options[q.correct]}"`;
  }

  document.getElementById('btnNext').classList.add('show');
}

/* ================================================================
   PYETJA TJETËR / FUND
================================================================ */
function nextQuestion() {
  current++;
  if (current < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

/* ================================================================
   EKRANI I REZULTATIT
================================================================ */
function showResult() {
  document.getElementById('quizScreen').style.display = 'none';
  const rs = document.getElementById('resultScreen');
  rs.classList.add('show');

  const pct = Math.round((score / questions.length) * 100);

  // Ikona dhe mesazhi
  let icon, msg;
  if (pct === 100) {
    icon = '🏆'; msg = 'Perfekt! Ti je një ekspert i vërtetë i botës së pijeve! Asnjë pyetje nuk të shpëtoi!';
  } else if (pct >= 80) {
    icon = '🥇'; msg = 'Shkëlqyeshëm! Njohuritë e tua për kokteje dhe spirita janë mbi mesataren. Vazhdo kështu!';
  } else if (pct >= 60) {
    icon = '🥈'; msg = 'Shumë mirë! Ke njohuri solide. Pak praktikë tjetër dhe do të jesh ekspert!';
  } else if (pct >= 40) {
    icon = '🥉'; msg = 'Jo keq! Ke baza të mira. Lexo dokumentet dhe provo sërish – do të befasohesh!';
  } else {
    icon = '📚'; msg = 'Mos u dekurajо! Kjo botë kërkon kohë. Shfletо menunë dhe provo sërish – mundesh!';
  }

  document.getElementById('resultIcon').textContent = icon;
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultOutOf').textContent = `pikë nga ${questions.length} (${pct}%)`;
  document.getElementById('resultMsg').textContent = msg;

  // Barrat sipas kategorisë (animate pas render)
  const barsDiv = document.getElementById('resultBars');
  barsDiv.innerHTML = Object.entries(catStats)
    .sort((a, b) => b[1].total - a[1].total)
    .map(([cat, s]) => {
      const p = Math.round((s.correct / s.total) * 100);
      return `
        <div class="result-bar-row">
          <div class="result-bar-label">${cat}</div>
          <div class="result-bar-track">
            <div class="result-bar-fill" data-pct="${p}" style="width:0%"></div>
          </div>
          <div class="result-bar-pct">${p}%</div>
        </div>`;
    }).join('');

  // Animate barrat pas 100ms
  setTimeout(() => {
    document.querySelectorAll('.result-bar-fill').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  }, 150);
}
